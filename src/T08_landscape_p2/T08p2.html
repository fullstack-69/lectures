<h1 id="fullstack-development">Fullstack Development</h1>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="2" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="part-2-the-battle-of-the-meta-frameworks">Part 2: The battle of the meta frameworks</h1>
<blockquote>
<p>Next.js vs Astro vs TanStack Start</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="3" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="what-meta-frameworks-do">What meta-frameworks do</h1>
<ul>
<li><strong>File-Based Routing</strong>
<ul>
<li>Files and folders define the URL structure of your app.</li>
</ul>
</li>
<li><strong>Server-Side Rendering (SSR)</strong>
<ul>
<li>Builds HTML on a server to make pages load fast and work well with search engines.</li>
</ul>
</li>
<li><strong>Static Site Generation (SSG)</strong>
<ul>
<li>Builds HTML at build time, so the server doesn't have to do any work when a user visits.</li>
</ul>
</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="4" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="what-meta-frameworks-do-1">What meta-frameworks do</h1>
<ul>
<li><strong>Data Fetching</strong>
<ul>
<li>Provides a way to fetch data from a database or API and pass it to your components.</li>
</ul>
</li>
<li><strong>Server Actions / RPC</strong>
<ul>
<li>Lets you call server-side code from the client without writing your own API endpoints.</li>
</ul>
</li>
<li><strong>Optimization</strong>: Speeds up images, scripts, and code automatically</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="5" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="elevator-pitches">Elevator pitches</h1>
<ul>
<li><code>Astro</code>: A content-first web framework that ships zero JavaScript by default.</li>
<li><code>Next.js</code>: A production framework for React, architected server-first around Server Components.</li>
<li><code>TanStack Start</code>: A production framework for React, architected client-first around a full SPA router — with SSR built in.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="6" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="modern-rendering-taxonomy">Modern rendering taxonomy</h1>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="7" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<ul>
<li><strong>Static Site Generation (SSG) / Static Prerendering / Partial Prerendering (PPR)</strong>
<ul>
<li>Build-time HTML, no server needed.</li>
</ul>
</li>
<li><strong>Server-Side Rendering (SSR)</strong>
<ul>
<li>HTML is built on the server per request.</li>
<li>Optional streaming</li>
</ul>
</li>
<li><strong>SSR + Hydration / Isomorphic Rendering</strong>
<ul>
<li>HTML is built on the server, then the client takes over and makes it interactive.</li>
</ul>
</li>
<li><strong>Client-Side Rendering (CSR)</strong>
<ul>
<li>HTML is built in the browser, no server rendering.</li>
</ul>
</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="8" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="rendering-modes---comparison">Rendering modes - comparison</h1>
<table>
<thead>
<tr>
<th>Name</th>
<th>When it runs</th>
<th>Where</th>
<th>Delivery</th>
</tr>
</thead>
<tbody>
<tr>
<td>SSG</td>
<td>Build time</td>
<td>Server</td>
<td>One complete HTML file</td>
</tr>
<tr>
<td>SSR</td>
<td>Request time</td>
<td>Server</td>
<td>One response (or streamed)</td>
</tr>
<tr>
<td>Isomorphic</td>
<td>Request time</td>
<td>Server + Client</td>
<td>One response, then rehydrated</td>
</tr>
<tr>
<td>CSR</td>
<td>Request time</td>
<td>Client</td>
<td>Blank shell, then client-rendered</td>
</tr>
</tbody>
</table>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="9" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="takeaway">Takeaway</h1>
<table>
<thead>
<tr>
<th>Name</th>
<th>Astro</th>
<th>Next.js</th>
<th>TanStack Start</th>
</tr>
</thead>
<tbody>
<tr>
<td>SSG</td>
<td>Astro Component</td>
<td>Server Component</td>
<td>*</td>
</tr>
<tr>
<td>SSR</td>
<td>Server Island</td>
<td>Server Component</td>
<td>*</td>
</tr>
<tr>
<td>Isomorphic</td>
<td>Client Island</td>
<td>Client Component</td>
<td>Any components</td>
</tr>
<tr>
<td>CSR</td>
<td>*</td>
<td>*</td>
<td>*</td>
</tr>
</tbody>
</table>
<blockquote>
<p>* = not the &quot;main&quot; behavior (in my opinion), but possible as an option.</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="10" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="takeaway-notes">Takeaway notes</h1>
<ul>
<li><strong>Astro default</strong> is SSG, everything else is opt-in.</li>
<li><strong>Next.js default</strong> is SSR, everything else is opt-in.
<ul>
<li>In V15 SSG/SSR is per route and is decided by the compiler (with exceptions).</li>
<li>In V16, with partial prerendering, SSG/SSR is per component and is decided by directives (<code>'use cache'</code>).</li>
</ul>
</li>
<li><strong>TanStack Start default</strong> is isomorphic (SSR + SPA hydration), everything else is opt-in.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="11" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="todo-app">Todo app</h1>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="12" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="the-todo-app">The todo app</h1>
<ul>
<li>Astro
<ul>
<li><code>git clone https://github.com/fullstack-69/ls-astro.git</code></li>
</ul>
</li>
<li>Next.js
<ul>
<li><code>git clone https://github.com/fullstack-69/ls-nextjs.git</code></li>
</ul>
</li>
<li>TanStack Start
<ul>
<li><code>git clone https://github.com/fullstack-69/ls-tanstack-start.git</code></li>
</ul>
</li>
<li>Same UI (Pico CSS), same database, same features.</li>
<li>Only the <strong>architecture</strong> differs.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="13" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="three-parts-three-timestamps">Three parts, three timestamps</h1>
<table>
<thead>
<tr>
<th>Component</th>
<th>What it does</th>
<th>Question it answers</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Nav</code></td>
<td>prints a timestamp</td>
<td>When was the shell made?</td>
</tr>
<tr>
<td><code>Greeting</code></td>
<td>reads <code>user-agent</code> + prints a timestamp</td>
<td>Was this per-request?</td>
</tr>
<tr>
<td><code>Todo</code></td>
<td>list + delete (interactive)</td>
<td>Where does the data enter?</td>
</tr>
</tbody>
</table>
<blockquote>
<p>If a timestamp never changes on refresh → it was <strong>baked at build time</strong>.</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="14" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="shared-data-layer">Shared data layer</h1>
<p><code>src/db/index.ts</code> — identical in all three projects</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-keyword">export</span> <span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">getTodos</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">await</span> <span class="hljs-title function_">ensureTodosTable</span>();
  <span class="hljs-keyword">await</span> <span class="hljs-title function_">sleep</span>(<span class="hljs-variable constant_">DB_LATENCY</span>); <span class="hljs-comment">// artificial latency, so we can SEE the loading states</span>

<h1 id="dx-comparison">DX comparison</h1>
<blockquote>
<p>From a perspective of a developer who knows React and SPA frameworks.</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="17" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="astro--two-familiar-things-kept-separate">Astro — two familiar things, kept separate</h1>
<ul>
<li>The Astro component is closer to a classic template language (Handlebars, EJS, Pug) than to React.
<ul>
<li><code>---</code> fence = data fetching. Template below = HTML output. No hooks, no lifecycle.</li>
<li>Fits my intuition immediately because it is the old-school model.</li>
</ul>
</li>
<li>The React island is <strong>100% ordinary React</strong>
<ul>
<li>It is a fully separate render tree with its own bundle.</li>
<li>No new React concepts. <code>useState</code>, <code>useEffect</code>, callbacks — all work as expected.</li>
</ul>
</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="18" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="nextjs--familiar-syntax-unfamiliar-rules">Next.js — familiar syntax, unfamiliar rules</h1>
<ul>
<li>Next repurposes <strong>ordinary-looking React syntax</strong> to mean something environment-dependent.
<ul>
<li>A string literal (<code>'use client'</code> / <code>'use server'</code> / <code>'use cache'</code>) is intercepted by the compiler and silently changes what the file is allowed to do and where it runs.</li>
</ul>
</li>
<li>It looks identical to the React I know. It behaves differently.
<ul>
<li>You cannot <code>import</code> a Server Component inside a <code>'use client'</code> file.</li>
<li>No <code>useState</code> in a server Component.</li>
</ul>
</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="19" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="tanstack-start--explicit-over-implicit">TanStack Start — explicit over implicit</h1>
<ul>
<li>No magic string. No compiler rewriting the meaning of a component file.</li>
<li>The server/client boundary is drawn by <strong>which function you're inside</strong>, not by a hidden annotation on the file.</li>
<li>Writing React component code is the <strong>same everywhere</strong>. The only difference is whether you call a server function or not.</li>
<li><code>TanStack Router</code> and <code>Query</code> are libraries SPA developers already have muscle memory for — <code>Start</code> reuses them rather than replacing them.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="20" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">

<h1 id="astro-component-anatomy">Astro component (anatomy)</h1>
<ul>
<li><strong>Component script</strong> — between the <code>---</code> fences.
<ul>
<li>Plain TS/JS, runs <strong>only on the server</strong>, never shipped to the browser.</li>
<li>Can <code>import</code> server-only modules freely (db, <code>node:fs</code>, secrets).</li>
</ul>
</li>
<li><strong>Component template</strong> — below the fences.
<ul>
<li>HTML + <code>{expressions}</code>.</li>
<li>Renders <strong>once</strong>, to a string. No re-render, no hooks, no state.</li>
</ul>
</li>
<li>Output: pure HTML. <strong>Zero JS.</strong></li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="24" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="astro-page">Astro page</h1>
<p><code>ls-astro/src/pages/index.astro</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">---
<span class="hljs-keyword">import</span> <span class="hljs-title class_">Layout</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@components/Layout.astro&quot;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-title class_">Nav</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@components/Nav.astro&quot;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-title class_">Greeting</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@components/Greeting.astro&quot;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-title class_">TodoReact</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@components/Todo.tsx&quot;</span>;
---

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Layout</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">Nav</span> /&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">Greeting</span> <span class="hljs-attr">server:defer</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">article</span> <span class="hljs-attr">slot</span>=<span class="hljs-string">&quot;fallback&quot;</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>Loading <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">aria-busy</span>=<span class="hljs-string">&quot;true&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">article</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">Greeting</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">TodoReact</span> <span class="hljs-attr">client:load</span> /&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">Layout</span>&gt;</span></span>
</code></pre>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="25" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="astro-page-routing">Astro page (routing)</h1>
<ul>
<li><strong>File-based routing</strong> — anything in <code>src/pages/</code> becomes a route.
<ul>
<li><code>src/pages/index.astro</code> → <code>/</code></li>
<li><code>src/pages/blog/[slug].astro</code> → <code>/blog/:slug</code></li>
</ul>
</li>
<li>A page is just an <code>.astro</code> component that returns a full document.</li>
<li><code>src/components/Layout.astro</code> is the html shell; children arrive via <code>&lt;slot /&gt;</code>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">&lt;body <span class="hljs-keyword">class</span>=<span class="hljs-string">&quot;container&quot;</span>&gt;
  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">slot</span> /&gt;</span></span>
&lt;/body&gt;
</code></pre>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="26" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="island-architecture">Island architecture</h1>
<blockquote>
<p>The page is a <strong>sea of static HTML</strong>. Interactivity lives in isolated <strong>islands</strong>.</p>
</blockquote>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌──────────────────────────────────────────┐
│  static HTML  ·  0 KB JS                 │
│   ┌──────────┐            ┌───────────┐  │
│   │  &lt;Nav/&gt;  │  static    │  Greeting │  │  ← server island
│   └──────────┘            └───────────┘  │
│   ┌────────────────────────────────────┐ │
│   │  &lt;TodoReact client:load /&gt;         │ │  ← client island (React)
│   └────────────────────────────────────┘ │
└──────────────────────────────────────────┘
</code></pre>
<p><em>Each island hydrates independently. No island → no JS.</em></p>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="27" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="two-kinds-of-islands">Two kinds of islands</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">&lt;<span class="hljs-title class_">Nav</span> /&gt;                         &lt;!-- <span class="hljs-number">1.</span> <span class="hljs-attr">plain</span>: <span class="hljs-keyword">static</span> <span class="hljs-variable constant_">HTML</span>, <span class="hljs-number">0</span> <span class="hljs-variable constant_">KB</span> <span class="hljs-variable constant_">JS</span> --&gt;
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Greeting</span> <span class="hljs-attr">server:defer</span> /&gt;</span></span>       &lt;!-- <span class="hljs-number">2.</span> server <span class="hljs-attr">island</span>: <span class="hljs-variable constant_">HTML</span> fetched at request time --&gt;
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">TodoReact</span> <span class="hljs-attr">client:load</span> /&gt;</span></span>       &lt;!-- <span class="hljs-number">3.</span> client <span class="hljs-attr">island</span>: <span class="hljs-title class_">React</span>, hydrated <span class="hljs-keyword">in</span> browser --&gt;
</code></pre>
<table>
<thead>
<tr>
<th></th>
<th>Renders where</th>
<th>JS to browser</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>&lt;Nav /&gt;</code></td>
<td>server, at build</td>
<td>none</td>
</tr>
<tr>
<td><code>server:defer</code></td>
<td>server, per request</td>
<td>none</td>
</tr>
<tr>
<td><code>client:load</code></td>
<td>server + browser</td>
<td>React + component</td>
</tr>
</tbody>
</table>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="28" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="client-islands--hydration-directives">Client islands — hydration directives</h1>
<table>
<thead>
<tr>
<th>Directive</th>
<th>Hydrates when</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>client:load</code></td>
<td>immediately on page load</td>
</tr>
<tr>
<td><code>client:idle</code></td>
<td>browser is idle</td>
</tr>
<tr>
<td><code>client:visible</code></td>
<td>island scrolls into viewport</td>
</tr>
<tr>
<td><code>client:media</code></td>
<td>CSS media query matches</td>
</tr>
<tr>
<td><code>client:only</code></td>
<td>never SSR'd — client render only</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Islands are the <strong>only</strong> JS in the bundle: <code>dist/client/_astro/Todo.*.js</code>.</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="29" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="server-islands">Server islands</h1>
<p><code>ls-astro/src/pages/index.astro</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">&lt;<span class="hljs-title class_">Greeting</span> <span class="hljs-attr">server</span>:defer&gt;
  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">article</span> <span class="hljs-attr">slot</span>=<span class="hljs-string">&quot;fallback&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Greeting<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>
      Loading <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">aria-busy</span>=<span class="hljs-string">&quot;true&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">article</span>&gt;</span></span>
&lt;/<span class="hljs-title class_">Greeting</span>&gt;
</code></pre>
<ul>
<li>Page HTML ships <strong>immediately</strong> with the <code>fallback</code>.</li>
<li>The island is then fetched from <code>/_server-islands/Greeting</code> and swapped in.</li>
<li>The static page can sit on a CDN; only the island hits the origin.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="30" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="astro-rendering-mode">Astro rendering mode</h1>
<p><code>ls-astro/astro.config.mjs</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-title function_">defineConfig</span>({
  <span class="hljs-attr">adapter</span>: <span class="hljs-title function_">node</span>({ <span class="hljs-attr">mode</span>: <span class="hljs-string">&quot;standalone&quot;</span> }),
  <span class="hljs-attr">integrations</span>: [<span class="hljs-title function_">react</span>()],
});
</code></pre>
<ul>
<li><strong><code>output: &quot;static&quot;</code> is the default</strong> — pages are prerendered to HTML at build.</li>
<li>The <code>adapter</code> adds a server, for islands / actions / SSR pages.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="31" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="opting-out-per-page">Opting out, per page</h1>
<p><code>ls-astro/src/pages/some-page.astro</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">---
<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> prerender = <span class="hljs-literal">false</span>;   <span class="hljs-comment">// this page now renders per request</span>
---
</code></pre>
<table>
<thead>
<tr>
<th>Mode</th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td>prerendered (default)</td>
<td>content is the same for everyone</td>
</tr>
<tr>
<td><code>prerender = false</code></td>
<td>page depends on the request (auth, personalization)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Astro makes you opt <strong>in</strong> to the server. Next.js and Start make you opt <strong>out</strong>.</p>
</blockquote>

<h1 id="proof-what-actually-got-built">Proof: what actually got built</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">dist/
├── client/
│   ├── index.html          ← the whole page, prerendered
│   └── _astro/Todo.*.js    ← the only JS shipped
└── server/
    └── chunks/Greeting.mjs ← the server island, rendered on demand
</code></pre>
<ul>
<li><code>Nav</code>'s timestamp is <strong>frozen</strong> in <code>index.html</code> (build time).</li>
<li><code>Greeting</code>'s timestamp changes on <strong>every request</strong>.</li>
<li><code>Todo</code>'s data arrives <strong>after</strong> hydration.</li>
</ul>

<h1 id="calling-an-action-from-an-island-1">Calling an Action from an island</h1>
<ul>
<li>Type-safe RPC — no <code>fetch</code>, no URL, no manual JSON.</li>
<li>Returns <code>{ data, error }</code>; errors are <strong>values</strong>, not exceptions.</li>
<li>The <code>import</code> looks local, but it compiles to a POST to <code>/_actions/...</code>.</li>
</ul>

<h1 id="astro-summary">Astro summary</h1>
<ul>
<li>Static HTML is the <strong>default</strong>; everything else is opt-in.</li>
<li><code>client:*</code> → client island (React ships).</li>
<li><code>server:defer</code> → server island (no JS ships).</li>
<li><code>actions</code> → the typed client → server boundary.</li>
<li>Mental model: <strong>an HTML document that occasionally contains an app.</strong></li>
</ul>
<footer>261497: Fullstack Development</footer>

<h1 id="server-component-rules">Server Component (rules)</h1>
<ul>
<li><strong>The default.</strong> No directive needed — every component in <code>app/</code> is a Server Component.</li>
<li>Can be <code>async</code> and <code>await</code> directly in the component body.</li>
<li>Can touch the database, secrets, <code>headers()</code>, <code>cookies()</code>.</li>
<li>Ships <strong>zero JS</strong> — the browser receives the rendered output, not the code.</li>
<li>Cannot use <code>useState</code>, <code>useEffect</code>, <code>onClick</code>, or any browser API.</li>
</ul>
<blockquote>
<p>This is the direct analogue of the <code>---</code> fence in an <code>.astro</code> file.</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="47" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">

<span class="hljs-keyword">import</span> { useEffect, useState, useTransition } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;react&quot;</span>;

<span class="hljs-keyword">const</span> <span class="hljs-title class_">TodoComponent</span>: <span class="hljs-variable constant_">FC</span> = <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-keyword">const</span> [todos, setTodos] = useState&lt;<span class="hljs-title class_">Todo</span>[]&gt;([]);
  <span class="hljs-keyword">const</span> [loading, startTransition] = <span class="hljs-title function_">useTransition</span>();

  <span class="hljs-title function_">useEffect</span>(<span class="hljs-function">() =&gt;</span> { <span class="hljs-title function_">startTransition</span>(fetchTodos); }, []);
  ...
};

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="48" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="client-component-rules">Client Component (rules)</h1>
<ul>
<li><code>&quot;use client&quot;</code> at the top of the file marks the <strong>boundary</strong>, not the file alone.
<ul>
<li>Everything imported <em>below</em> it also becomes client code.</li>
</ul>
</li>
<li>Still <strong>server-rendered once</strong> (for the HTML), then <strong>hydrated</strong> in the browser.</li>
<li>Gets hooks, event handlers, browser APIs.</li>
<li>Astro's <code>client:load</code> = Next's <code>&quot;use client&quot;</code> — but Next has <strong>no <code>client:visible</code></strong>; hydration is not scheduled per-component.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="49" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">

<h1 id="calling-a-server-action">Calling a Server Action</h1>
<p><code>ls-nextjs/src/components/Todo.tsx</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> <span class="hljs-title function_">actionGetTodos</span>(); <span class="hljs-comment">// looks like a local call...</span>
<span class="hljs-title function_">setTodos</span>(data);

<span class="hljs-keyword">await</span> <span class="hljs-title function_">actionDeleteTodo</span>(todo.<span class="hljs-property">id</span>); <span class="hljs-comment">// ...is actually a POST to the server</span>
</code></pre>
<ul>
<li>The bundler replaces the function body with an <strong>RPC stub + an ID</strong>.</li>
<li>Throws on error → wrap in <code>try/catch</code> (Astro returns <code>{ data, error }</code> instead).</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> No built-in input validation: <code>id: number</code> is a <em>compile-time</em> claim only.<br />
Astro's <code>input: z.object(...)</code> and TanStack's <code>.validator()</code> do this for you.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="51" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="partial-prerendering-ppr">Partial Prerendering (PPR)</h1>
<blockquote>
<p>One route = a <strong>static shell</strong> delivered instantly + <strong>dynamic holes</strong> streamed in.</p>
</blockquote>
<p><code>ls-nextjs/next.config.ts</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-keyword">const</span> <span class="hljs-attr">nextConfig</span>: <span class="hljs-title class_">NextConfig</span> = {
  <span class="hljs-attr">reactCompiler</span>: <span class="hljs-literal">true</span>,
  <span class="hljs-attr">cacheComponents</span>: <span class="hljs-literal">true</span>, <span class="hljs-comment">// Enables &#x27;use cache&#x27; behavior</span>
};
</code></pre>
<ul>
<li>Previously <code>experimental.ppr</code>; in Next 16 it is driven by <code>cacheComponents</code>.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="52" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="ppr--the-static-half">PPR — the static half</h1>
<p><code>ls-nextjs/src/components/Nav.tsx</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">const</span> <span class="hljs-title class_">Nav</span>: <span class="hljs-variable constant_">FC</span> = <span class="hljs-title function_">async</span> () =&gt; {
  <span class="hljs-string">&quot;use cache&quot;</span>; <span class="hljs-comment">// → prerendered into the shell</span>
  <span class="hljs-keyword">const</span> timeStr = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>().<span class="hljs-title function_">toLocaleTimeString</span>();
  <span class="hljs-keyword">return</span> (
    <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">nav</span>&gt;</span>
      ...<span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#NA&quot;</span>&gt;</span>Generated at: {timeStr}<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span>...
    <span class="hljs-tag">&lt;/<span class="hljs-name">nav</span>&gt;</span></span>
  );
};
</code></pre>
<ul>
<li><code>&quot;use cache&quot;</code> = &quot;this output is not per-request, bake it.&quot;</li>
<li>Its timestamp is <strong>frozen at build</strong>, exactly like Astro's <code>Nav.astro</code>.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="53" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="ppr--the-dynamic-half">PPR — the dynamic half</h1>
<p><code>ls-nextjs/src/app/page.tsx</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx">&lt;<span class="hljs-title class_">Suspense</span> fallback={<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>Loading…<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span></span>}&gt;
  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Greeting</span> /&gt;</span></span> {<span class="hljs-comment">/* calls headers() → cannot be prerendered */</span>}
&lt;/<span class="hljs-title class_">Suspense</span>&gt;
</code></pre>
<ul>
<li><code>headers()</code> makes <code>Greeting</code> <strong>dynamic</strong>, so it must not block the shell.</li>
<li>Next prerenders the page <strong>with the fallback in place</strong>, then streams the real HTML into the hole.</li>
<li>Forget the <code>&lt;Suspense&gt;</code> and the build fails — the boundary is the contract.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="54" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="ppr-vs-astro-server-islands">PPR vs. Astro server islands</h1>
<table>
<thead>
<tr>
<th></th>
<th>Astro</th>
<th>Next.js</th>
</tr>
</thead>
<tbody>
<tr>
<td>Static shell</td>
<td><code>.astro</code> page, prerendered</td>
<td>route shell, prerendered</td>
</tr>
<tr>
<td>Dynamic hole</td>
<td><code>&lt;Greeting server:defer&gt;</code></td>
<td><code>&lt;Suspense&gt;&lt;Greeting/&gt;&lt;/Suspense&gt;</code></td>
</tr>
<tr>
<td>Placeholder</td>
<td><code>slot=&quot;fallback&quot;</code></td>
<td><code>fallback={...}</code></td>
</tr>
<tr>
<td>Delivery</td>
<td>second HTTP request</td>
<td>streamed in the same response</td>
</tr>
<tr>
<td>Marked by</td>
<td>directive on the tag</td>
<td><em>inferred</em> from dynamic API usage</td>
</tr>
</tbody>
</table>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="55" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="nextjs-summary">Next.js summary</h1>
<ul>
<li>Server is the default; the client is opt-in via <code>&quot;use client&quot;</code>.</li>
<li>One language, one component model, one mental model — React everywhere.</li>
<li>Static / dynamic is <strong>inferred</strong> from what your code touches, not declared.</li>
<li>Mental model: <strong>an app that happens to render on the server first.</strong></li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="56" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="tanstack-start">TanStack Start</h1>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="57" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="file-based-routing">File-based routing</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">ls-tanstack-start/src/routes/
├── __root.tsx                    → the shell (html/head/body)
├── index.tsx                     → /
├── ssr_prerendered.tsx           → /ssr_prerendered
└── ssr_awaited.tsx               → /ssr_awaited
</code></pre>
<ul>
<li>Files → routes, but <strong>compiled into a typed route tree</strong>: <code>src/routeTree.gen.ts</code>.</li>
<li>Generated automatically by the Vite plugin. <strong>Never edit it.</strong></li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="58" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="the-root-route">The root route</h1>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="59" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<p><code>ls-tanstack-start/src/routes/__root.tsx</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title class_">Route</span> = <span class="hljs-title function_">createRootRoute</span>({
  <span class="hljs-attr">head</span>: <span class="hljs-function">() =&gt;</span> ({
    <span class="hljs-attr">meta</span>: [{ <span class="hljs-attr">title</span>: <span class="hljs-string">&quot;TanStack Start&quot;</span> }, { <span class="hljs-attr">charSet</span>: <span class="hljs-string">&quot;utf-8&quot;</span> }],
    <span class="hljs-attr">links</span>: [{ <span class="hljs-attr">rel</span>: <span class="hljs-string">&quot;stylesheet&quot;</span>, <span class="hljs-attr">href</span>: picoStyles }],
  }),
  <span class="hljs-attr">shellComponent</span>: <span class="hljs-title class_">RootDocument</span>,

<span class="hljs-keyword">function</span> <span class="hljs-title function_">RootDocument</span>(<span class="hljs-params">{ children }: { children: React.ReactNode }</span>) {
  <span class="hljs-keyword">return</span> (
    <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;en&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">HeadContent</span> /&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>

        {children}
        <span class="hljs-tag">&lt;<span class="hljs-name">Scripts</span> /&gt;</span>

}
