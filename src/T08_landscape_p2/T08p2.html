<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="60" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="a-route">A route</h1>
<p><code>ls-tanstack-start/src/routes/index.tsx</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title class_">Route</span> = <span class="hljs-title function_">createFileRoute</span>(<span class="hljs-string">&quot;/&quot;</span>)({
  <span class="hljs-attr">component</span>: <span class="hljs-title class_">Home</span>,
  <span class="hljs-attr">loader</span>: <span class="hljs-title function_">async</span> () =&gt; {
    <span class="hljs-keyword">const</span> nav = <span class="hljs-keyword">await</span> <span class="hljs-title function_">getNavTime</span>();
    <span class="hljs-keyword">const</span> greeting = <span class="hljs-keyword">await</span> <span class="hljs-title function_">getGreeting</span>();
    <span class="hljs-keyword">return</span> { nav, greeting };
  },
});
</code></pre>
<ul>
<li>A route is a <strong>declarative object</strong>: a path, a component, and its data.</li>
<li>Not a default export — the router imports <code>Route</code> by convention.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="61" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="the-routes-component">The route's component</h1>
<p><code>ls-tanstack-start/src/routes/index.tsx</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">Home</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> state = <span class="hljs-title class_">Route</span>.<span class="hljs-title function_">useLoaderData</span>(); <span class="hljs-comment">// fully typed, no generics needed</span>

  <span class="hljs-keyword">return</span> (
    <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">main</span> <span class="hljs-attr">className</span>=<span class="hljs-string">&quot;container&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">Nav</span> <span class="hljs-attr">timeStr</span>=<span class="hljs-string">{state.nav.timeStr}</span> /&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">Greeting</span>
        <span class="hljs-attr">browser</span>=<span class="hljs-string">{state.greeting.browser}</span>
        <span class="hljs-attr">timeStr</span>=<span class="hljs-string">{state.greeting.timeStr}</span>
      /&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">Todo</span> /&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">main</span>&gt;</span></span>
  );
}
</code></pre>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="62" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="loaders">Loaders</h1>
<ul>
<li>A route <strong>declares its own data</strong> in <code>loader</code>.
<ul>
<li>Runs on the server during SSR, and on the client during SPA navigation.</li>
</ul>
</li>
<li><code>Route.useLoaderData()</code> is typed from the loader's return — no manual types.</li>
<li>Contrast:
<ul>
<li>Next: each Server Component fetches its own data.</li>
<li>Astro: the page frontmatter fetches.</li>
<li>Start: <strong>the route</strong> fetches, then passes down as props.</li>
</ul>
</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="63" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="typed-links">Typed links</h1>
<p><code>ls-tanstack-start/src/components/Nav.tsx</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Link</span>, useLocation } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@tanstack/react-router&quot;</span>;

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Link</span>
  <span class="hljs-attr">to</span>=<span class="hljs-string">&quot;/ssr_prerendered&quot;</span>
  <span class="hljs-attr">className</span>=<span class="hljs-string">{isActive(</span>&quot;/<span class="hljs-attr">ssr_prerendered</span>&quot;) ? &quot;<span class="hljs-attr">active</span>&quot; <span class="hljs-attr">:</span> &quot;&quot;}
&gt;</span>
  SSR Prerendered
<span class="hljs-tag">&lt;/<span class="hljs-name">Link</span>&gt;</span></span>;
</code></pre>
<ul>
<li><code>to</code> is checked against the generated route tree — a typo is a <strong>type error</strong>.</li>
<li>Client-side navigation (SPA), with <code>defaultPreload: &quot;intent&quot;</code> prefetching on hover.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="64" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="isomorphic-components">Isomorphic components</h1>
<p><code>ls-tanstack-start/src/components/Greeting.tsx</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">GreetingProps</span> {
  <span class="hljs-attr">browser</span>: <span class="hljs-built_in">string</span>;
  <span class="hljs-attr">timeStr</span>: <span class="hljs-built_in">string</span>;
}

<span class="hljs-keyword">const</span> <span class="hljs-title class_">Greeting</span>: <span class="hljs-variable constant_">FC</span>&lt;<span class="hljs-title class_">GreetingProps</span>&gt; = <span class="hljs-function">(<span class="hljs-params">{ browser, timeStr }</span>) =&gt;</span> (
  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">article</span> <span class="hljs-attr">className</span>=<span class="hljs-string">&quot;card&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Hello, {browser}!<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>Generated at: {timeStr}<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">article</span>&gt;</span></span>
);
</code></pre>
<blockquote>
<p><strong>No <code>&quot;use client&quot;</code>. No <code>&quot;use server&quot;</code>. No <code>client:load</code>.</strong></p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="65" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="isomorphic--what-it-means">Isomorphic — what it means</h1>
<ul>
<li>There is <strong>one</strong> kind of component. It runs on the server (SSR) <em>and</em> in the browser (hydration).</li>
<li>Every component ships to the client. There is no &quot;server-only component&quot;.</li>
<li>So the server/client boundary is <strong>not</strong> the component — it is the <strong>server function</strong>.</li>
</ul>
<table>
<thead>
<tr>
<th>Framework</th>
<th>Boundary drawn at</th>
</tr>
</thead>
<tbody>
<tr>
<td>Astro</td>
<td>the island tag (<code>client:load</code>)</td>
</tr>
<tr>
<td>Next.js</td>
<td>the file (<code>&quot;use client&quot;</code>)</td>
</tr>
<tr>
<td>Start</td>
<td>the <strong>function call</strong> (<code>createServerFn</code>)</td>
</tr>
</tbody>
</table>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="66" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="server-functions">Server functions</h1>
<p><code>ls-tanstack-start/src/actions/index.ts</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-keyword">import</span> { createServerFn } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@tanstack/react-start&quot;</span>;
<span class="hljs-keyword">import</span> { getRequestHeaders } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@tanstack/react-start/server&quot;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> getGreeting = <span class="hljs-title function_">createServerFn</span>({ <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;GET&quot;</span> }).<span class="hljs-title function_">handler</span>(
  <span class="hljs-title function_">async</span> () =&gt; {
    <span class="hljs-keyword">const</span> header = <span class="hljs-title function_">getRequestHeaders</span>();
    <span class="hljs-keyword">const</span> ua = header.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;user-agent&quot;</span>) ?? <span class="hljs-string">&quot;&quot;</span>;
    <span class="hljs-keyword">return</span> {
      <span class="hljs-attr">browser</span>: <span class="hljs-keyword">new</span> <span class="hljs-title class_">UAParser</span>(ua).<span class="hljs-title function_">getResult</span>().<span class="hljs-property">browser</span>.<span class="hljs-property">name</span> || <span class="hljs-string">&quot;Unknown&quot;</span>,
      <span class="hljs-attr">timeStr</span>: <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>().<span class="hljs-title function_">toLocaleTimeString</span>(),
    };
  },
);
</code></pre>
<ul>
<li>Explicit <code>method</code> — <code>GET</code> is cacheable, <code>POST</code> is a mutation.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="67" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="server-functions--validation">Server functions — validation</h1>
<p><code>ls-tanstack-start/src/actions/index.ts</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-keyword">const</span> deleteTodoSchema = z.<span class="hljs-title function_">object</span>({ <span class="hljs-attr">id</span>: z.<span class="hljs-title function_">number</span>() });

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> actionDeleteTodo = <span class="hljs-title function_">createServerFn</span>({ <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;POST&quot;</span> })
  .<span class="hljs-title function_">validator</span>(deleteTodoSchema) <span class="hljs-comment">// runtime-validated input</span>
  .<span class="hljs-title function_">handler</span>(<span class="hljs-title function_">async</span> ({ data }) =&gt; {
    <span class="hljs-keyword">await</span> <span class="hljs-title function_">deleteTodo</span>(data.<span class="hljs-property">id</span>);
    <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
  });
</code></pre>
<ul>
<li>Builder chain: <code>createServerFn</code> → <code>.middleware()</code> → <code>.validator()</code> → <code>.handler()</code>.</li>
<li>The <code>.handler</code> body is <strong>stripped from the client bundle</strong>; the call becomes an RPC.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="68" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="calling-a-server-function">Calling a server function</h1>
<p><code>ls-tanstack-start/src/components/Todo.tsx</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">import</span> { useServerFn } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@tanstack/react-start&quot;</span>;

<span class="hljs-keyword">const</span> getTodos = <span class="hljs-title function_">useServerFn</span>(actionGetTodos);
<span class="hljs-keyword">const</span> deleteTodo = <span class="hljs-title function_">useServerFn</span>(actionDeleteTodo);

<span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> <span class="hljs-title function_">getTodos</span>();
<span class="hljs-keyword">await</span> <span class="hljs-title function_">deleteTodo</span>({ <span class="hljs-attr">data</span>: { <span class="hljs-attr">id</span>: todo.<span class="hljs-property">id</span> } }); <span class="hljs-comment">// note the { data: ... } envelope</span>
</code></pre>
<ul>
<li>Direct call works too; <code>useServerFn</code> additionally integrates with the router<br />
(redirects, error handling, invalidation).</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="69" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="prerendering">Prerendering</h1>
<p><code>ls-tanstack-start/vite.config.ts</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-title function_">tanstackStart</span>({
  <span class="hljs-attr">prerender</span>: {
    <span class="hljs-attr">enabled</span>: <span class="hljs-literal">true</span>,
    <span class="hljs-attr">crawlLinks</span>: <span class="hljs-literal">true</span>, <span class="hljs-comment">// follow links and prerender those too</span>
    <span class="hljs-attr">filter</span>: <span class="hljs-function">(<span class="hljs-params">{ path }</span>) =&gt;</span>
      [<span class="hljs-string">&quot;/ssr_prerendered&quot;</span>, <span class="hljs-string">&quot;/ssr_awaited_prerendered&quot;</span>].<span class="hljs-title function_">includes</span>(path),
  },
});
</code></pre>
<ul>
<li><strong>Off by default</strong> — the opposite of Astro.</li>
<li>At build, Start renders the chosen routes to static HTML.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="70" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="prerendering--the-catch">Prerendering — the catch</h1>
<p><code>ls-tanstack-start/src/actions/index.ts</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-keyword">import</span> { staticFunctionMiddleware } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@tanstack/start-static-server-functions&quot;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> getNavTime = <span class="hljs-title function_">createServerFn</span>({ <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;GET&quot;</span> })
  .<span class="hljs-title function_">middleware</span>([staticFunctionMiddleware]) <span class="hljs-comment">// result baked at build time</span>
  .<span class="hljs-title function_">handler</span>(<span class="hljs-title function_">async</span> () =&gt; ({ <span class="hljs-attr">timeStr</span>: <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>().<span class="hljs-title function_">toLocaleTimeString</span>() }));
</code></pre>
<ul>
<li>Prerendering the <em>page</em> is not enough — the <strong>server function results</strong> must be frozen too.</li>
<li>Otherwise the static HTML re-fetches on hydration and the timestamp jumps.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="71" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="streaming-a-slow-part">Streaming a slow part</h1>
<p><code>ls-tanstack-start/src/routes/ssr_awaited.tsx</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-attr">loader</span>: (<span class="hljs-title function_">async</span> () =&gt; ({
  <span class="hljs-attr">nav</span>: <span class="hljs-keyword">await</span> <span class="hljs-title function_">getNavTime</span>(),
  <span class="hljs-attr">greetingPromise</span>: <span class="hljs-title function_">getGreeting</span>(), <span class="hljs-comment">// NOT awaited → sent as a promise</span>
}),
  (
    <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Suspense</span> <span class="hljs-attr">fallback</span>=<span class="hljs-string">{</span>&lt;<span class="hljs-attr">span</span> <span class="hljs-attr">aria-busy</span>=<span class="hljs-string">&quot;true&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>}&gt;
      <span class="hljs-tag">&lt;<span class="hljs-name">Await</span> <span class="hljs-attr">promise</span>=<span class="hljs-string">{state.greetingPromise}</span>&gt;</span>
        {(greeting) =&gt; (
          <span class="hljs-tag">&lt;<span class="hljs-name">Greeting</span> <span class="hljs-attr">browser</span>=<span class="hljs-string">{greeting.browser}</span> <span class="hljs-attr">timeStr</span>=<span class="hljs-string">{greeting.timeStr}</span> /&gt;</span>
        )}
      <span class="hljs-tag">&lt;/<span class="hljs-name">Await</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">Suspense</span>&gt;</span></span>
  ));
</code></pre>
<ul>
<li>Start's answer to <code>server:defer</code> / PPR: <strong>don't await it in the loader</strong>.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="72" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="tanstack-start-summary">TanStack Start summary</h1>
<ul>
<li>The <strong>router</strong> is the framework; SSR is a feature bolted on top of a real SPA router.</li>
<li>One component model; the boundary is <code>createServerFn</code>.</li>
<li>End-to-end type safety: routes, links, loader data, server-fn input &amp; output.</li>
<li>Nothing is static unless you ask.</li>
<li>Mental model: <strong>a SPA that can also render on the server.</strong></li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="73" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="a-better-framing-than-mpa-vs-spa">A better framing than MPA vs SPA</h1>
<blockquote>
<p>What does the framework <strong>assume by default</strong>, and what has to be <strong>specially marked</strong> to deviate?</p>
</blockquote>
<ul>
<li><code>Astro</code> — assumes <strong>nothing runs</strong>. Static HTML at build. Everything else opts in.</li>
<li><code>Next.js</code> — assumes the <strong>server runs it fresh, per request</strong>. Static is earned as an optimisation.</li>
<li><code>TanStack Start</code> — assumes the <strong>server runs it, then hands the whole tree to the client</strong>.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="74" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="the-exception-axis">The &quot;exception&quot; axis</h1>
<table>
<thead>
<tr>
<th></th>
<th>Astro</th>
<th>Next.js</th>
<th>TanStack Start</th>
</tr>
</thead>
<tbody>
<tr>
<td>Default</td>
<td>build-time static</td>
<td>per-request server</td>
<td>per-request server → SPA</td>
</tr>
<tr>
<td>Default output</td>
<td>static HTML, 0 JS</td>
<td>server-rendered HTML</td>
<td>server-rendered SPA shell</td>
</tr>
<tr>
<td>The exception</td>
<td>server island / client island</td>
<td>static generation / <code>&quot;use client&quot;</code></td>
<td>static server function</td>
</tr>
</tbody>
</table>
<blockquote>
<p>The exception is what you reach for to <strong>break out of the default mode</strong>.</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="75" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="what-has-to-justify-itself">What has to justify itself?</h1>
<table>
<thead>
<tr>
<th></th>
<th>What needs no justification</th>
<th>What needs a directive</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Astro</strong></td>
<td>static HTML</td>
<td>anything server-per-request, anything interactive</td>
</tr>
<tr>
<td><strong>Next.js</strong></td>
<td>server rendering every request</td>
<td>static pages, client-side interactivity</td>
</tr>
<tr>
<td><strong>TanStack Start</strong></td>
<td>SSR + SPA hydration</td>
<td>frozen / prerendered pages</td>
</tr>
</tbody>
</table>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="76" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="default-execution-unit">Default execution unit</h1>
<blockquote>
<p>At what granularity does the default mode apply?</p>
</blockquote>
<table>
<thead>
<tr>
<th></th>
<th>Default execution unit</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Astro</strong></td>
<td>per component (build time)</td>
</tr>
<tr>
<td><strong>Next.js</strong></td>
<td>per component (request time)</td>
</tr>
<tr>
<td><strong>TanStack Start</strong></td>
<td>per <strong>route</strong> (request time, then hydrates whole tree)</td>
</tr>
</tbody>
</table>
<ul>
<li>Astro and Next both isolate at the <strong>component</strong> — islands sit next to each other with different timing.</li>
<li>Start treats the <strong>whole route</strong> as one server execution, then rehydrates all of it into the SPA.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="77" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="static-opt-in-unit">Static opt-in unit</h1>
<blockquote>
<p>At what granularity do you opt <strong>out</strong> of the per-request default?</p>
</blockquote>
<table>
<thead>
<tr>
<th></th>
<th>Static opt-in unit</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Astro</strong></td>
<td>per component (<code>server:defer</code>/<code>client:*</code> to <strong>add</strong> dynamism to a static default)</td>
</tr>
<tr>
<td><strong>Next.js</strong></td>
<td>file / route (<code>&quot;use client&quot;</code>, <code>force-static</code>, <code>generateStaticParams</code>)</td>
</tr>
<tr>
<td><strong>TanStack Start</strong></td>
<td><strong>individual server function</strong> (<code>staticFunctionMiddleware</code>)</td>
</tr>
</tbody>
</table>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="78" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="starts-granularity-is-finer-than-its-own-route">Start's granularity is finer than its own route</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-comment">// src/routes/index.tsx — one route, mixed timing</span>
<span class="hljs-attr">loader</span>: <span class="hljs-title function_">async</span> () =&gt; {
  <span class="hljs-keyword">const</span> nav = <span class="hljs-keyword">await</span> <span class="hljs-title function_">getNavTime</span>();        <span class="hljs-comment">// staticFunctionMiddleware → baked at build</span>
  <span class="hljs-keyword">const</span> greeting = <span class="hljs-keyword">await</span> <span class="hljs-title function_">getGreeting</span>(); <span class="hljs-comment">// plain server fn → live per-request</span>
  <span class="hljs-keyword">return</span> { nav, greeting };
},
</code></pre>
<ul>
<li><code>getNavTime</code> is frozen; <code>getGreeting</code> stays live — <strong>on the same route</strong>.</li>
<li>In Next, the equivalent switch (<code>force-static</code>) is a file-level export that locks the whole route.</li>
<li>Start's static unit is <strong>finer</strong> than the route default that contains it.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="79" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="the-ordering-that-matters">The ordering that matters</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Astro             Next.js            TanStack Start
────────────────  ─────────────────  ────────────────────
build-time first  server-first, but  server-first, then
                  provably static    client-owned
</code></pre>
<blockquote>
<p><strong>Astro</strong>: nothing runs unless you say so.<br />
<strong>Next.js</strong>: the server runs it, but tries to prove it didn't have to.<br />
<strong>Start</strong>: the server runs it, then gives everything to the client.</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="80" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="side-by-side--the-same-four-ideas">Side by side — the same four ideas</h1>
<table>
<thead>
<tr>
<th>Concept</th>
<th>Astro</th>
<th>Next.js</th>
<th>TanStack Start</th>
</tr>
</thead>
<tbody>
<tr>
<td>Route</td>
<td><code>src/pages/index.astro</code></td>
<td><code>src/app/page.tsx</code></td>
<td><code>src/routes/index.tsx</code></td>
</tr>
<tr>
<td>Server-only render</td>
<td><code>.astro</code> component</td>
<td>Server Component</td>
<td>server function (<code>createServerFn</code>)</td>
</tr>
<tr>
<td>Interactivity</td>
<td><code>&lt;C client:load /&gt;</code></td>
<td><code>&quot;use client&quot;</code></td>
<td>every component</td>
</tr>
<tr>
<td>Client → server call</td>
<td><code>actions.foo()</code></td>
<td><code>&quot;use server&quot;</code> fn</td>
<td><code>useServerFn(foo)</code></td>
</tr>
</tbody>
</table>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="81" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="side-by-side--rendering-defaults">Side by side — rendering defaults</h1>
<table>
<thead>
<tr>
<th></th>
<th>Astro</th>
<th>Next.js</th>
<th>TanStack Start</th>
</tr>
</thead>
<tbody>
<tr>
<td>Default output</td>
<td><strong>static</strong></td>
<td>static, dynamic where needed</td>
<td><strong>SSR per request</strong></td>
</tr>
<tr>
<td>Opt out</td>
<td><code>prerender = false</code></td>
<td>dynamic API usage</td>
<td><code>prerender: { enabled: true }</code></td>
</tr>
<tr>
<td>Deferred part</td>
<td><code>server:defer</code> island</td>
<td><code>&lt;Suspense&gt;</code> + PPR</td>
<td>unawaited promise + <code>&lt;Await&gt;</code></td>
</tr>
<tr>
<td>JS shipped by default</td>
<td><strong>none</strong></td>
<td>client components only</td>
<td><strong>the whole app</strong></td>
</tr>
</tbody>
</table>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="82" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="side-by-side--the-client%E2%86%94server-call">Side by side — the client<img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/>server call</h1>
<table>
<thead>
<tr>
<th></th>
<th>Astro</th>
<th>Next.js</th>
<th>TanStack Start</th>
</tr>
</thead>
<tbody>
<tr>
<td>Declared by</td>
<td><code>defineAction</code></td>
<td><code>&quot;use server&quot;</code></td>
<td><code>createServerFn</code></td>
</tr>
<tr>
<td>Input validation</td>
<td><code>input: z.object()</code> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>none <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td><code>.validator()</code> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td>Errors</td>
<td><code>{ data, error }</code></td>
<td><code>throw</code></td>
<td><code>throw</code></td>
</tr>
<tr>
<td>HTTP method</td>
<td>POST</td>
<td>POST</td>
<td>you choose</td>
</tr>
</tbody>
</table>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="83" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="a-fifth-axis--cacheability">A fifth axis — cacheability</h1>
<blockquote>
<p>The three frameworks ship <strong>very different things</strong> on the wire. That determines what a CDN can cache, without any app changes.</p>
</blockquote>
<ul>
<li><strong>Astro</strong> — two independent HTTP requests: shell (static) + island (dynamic).</li>
<li><strong>Next.js PPR</strong> — one chunked HTTP response: static shell + streamed holes in the same connection.</li>
<li><strong>TanStack Start</strong> — one per-request response: no static/dynamic split in the transport at all.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="84" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="server-side-caching">Server-side caching</h1>
<table>
<thead>
<tr>
<th></th>
<th>What's cacheable</th>
<th>Cached by</th>
<th>Mechanism</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Astro</strong></td>
<td>shell + island, independently</td>
<td>any CDN incl. nginx</td>
<td>two separate HTTP GETs</td>
</tr>
<tr>
<td><strong>Next.js</strong></td>
<td>shell (in theory)</td>
<td>streaming-aware edge (Vercel)</td>
<td>one chunked response, shell + streamed holes</td>
</tr>
<tr>
<td><strong>TanStack Start</strong></td>
<td>only <code>staticFunctionMiddleware</code> output</td>
<td>build output / CDN</td>
<td>no shell; page is either fully live or frozen at build</td>
</tr>
</tbody>
</table>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="85" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="astro--two-requests-two-caches">Astro — two requests, two caches</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Browser ──GET /──────────────────<img class="emoji" draggable="false" alt="▶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/25b6.svg" data-marp-twemoji=""/> CDN (nginx, any CDN)
                                       ├── HIT: serve cached index.html  ← shell
                                       └── MISS: fetch from origin once, cache 10 min

Browser ──GET /_server-islands/Greeting<img class="emoji" draggable="false" alt="▶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/25b6.svg" data-marp-twemoji=""/> Astro server (bypasses CDN cache)
                                            ├── reads user-agent, renders Greeting
                                            └── returns HTML fragment
</code></pre>
<ul>
<li>The shell (<code>index.html</code>) and the island (<code>/_server-islands/Greeting</code>) are <strong>different URLs</strong> with different caching rules.</li>
<li>nginx (or any reverse proxy) caches the shell the same way it caches any static file — no streaming support needed.</li>
<li>The island can also be cached independently (e.g. 10s TTL) if it is not truly per-user.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="86" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="nextjs-ppr--one-response-shared-pipe">Next.js PPR — one response, shared pipe</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Browser ──GET /──────────────────<img class="emoji" draggable="false" alt="▶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/25b6.svg" data-marp-twemoji=""/> Edge (Vercel)
                                    ├── send cached static shell immediately (HIT)
                                    └── open chunked transfer; stream dynamic holes into same connection
</code></pre>
<ul>
<li>The capability is real — the framework supports it.</li>
<li>But shell + dynamic content share <strong>one HTTP response</strong>. nginx has no concept of &quot;cache part of this response and pass through the rest of the same connection.&quot;</li>
<li><strong>This is not a missing config option</strong> — it is a genuine feature gap between generic reverse proxies and PPR-aware edge infrastructure built into Vercel.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="87" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="tanstack-start--no-middle-tier">TanStack Start — no middle tier</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Browser ──GET /──────────────────<img class="emoji" draggable="false" alt="▶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/25b6.svg" data-marp-twemoji=""/> Node server (always)
                                    ├── run all loaders
                                    ├── render full HTML
                                    └── return one complete response
</code></pre>
<ul>
<li>There is <strong>no shell/dynamic split</strong> in the response — one document, generated fresh, every time.</li>
<li>The only escape: pull data out of the per-request path via <code>staticFunctionMiddleware</code> — but that freezes at the individual function level.</li>
<li><strong>Two modes, nothing in between:</strong> fully live per-request, or function result frozen at build.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="88" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="a-sixth-axis--client-navigation-caching">A sixth axis — client navigation caching</h1>
<blockquote>
<p>This is separate from server caching. It governs what happens <strong>after</strong> the page is in the browser.</p>
</blockquote>
<table>
<thead>
<tr>
<th></th>
<th>Client-side navigation caching</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Astro</strong></td>
<td>None — MPA by default; each nav is a fresh full page load</td>
</tr>
<tr>
<td><strong>Next.js</strong></td>
<td>Router Cache for prefetched segments (implicit, version-dependent)</td>
</tr>
<tr>
<td><strong>TanStack Start</strong></td>
<td>Explicit SWR cache in the router: <code>staleTime</code>, <code>gcTime</code>, <code>preloadStaleTime</code> — configurable per route</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Start is the only one of the three that also gives you a fully explicit, tunable cache for what happens <strong>after</strong> the page arrives.</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="89" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="starts-router-cache--three-timers">Start's router cache — three timers</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title class_">Route</span> = <span class="hljs-title function_">createFileRoute</span>(<span class="hljs-string">&quot;/&quot;</span>)({
  <span class="hljs-attr">loader</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">getGreeting</span>(),
  <span class="hljs-attr">staleTime</span>: <span class="hljs-number">60_000</span>, <span class="hljs-comment">// navigating back within 60s reuses cached data</span>
  <span class="hljs-attr">preloadStaleTime</span>: <span class="hljs-number">10_000</span>, <span class="hljs-comment">// hover re-preloads if older than 10s</span>
});
</code></pre>
<ul>
<li><code>preloadStaleTime</code> — governs <strong>hover</strong> (prefetch trigger). Default: 30s.</li>
<li><code>staleTime</code> — governs <strong>click</strong> (navigation trigger). Default: 0 (always refetch).</li>
<li><code>gcTime</code> — how long cached data is kept in memory after the route is left.</li>
</ul>
<blockquote>
<p><code>staleTime: 0</code> is why every navigation reruns the loader even when the page was prerendered.</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="90" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="why-starts-client-cache-exists">Why Start's client cache exists</h1>
<ul>
<li>Astro and Next treat &quot;the app is a persistent client-side router&quot; as the exception.
<ul>
<li>Astro: full page reload per navigation by default.</li>
<li>Next: implicit router cache, behaviour changes between versions.</li>
</ul>
</li>
<li>Start treats the client router as the <strong>primitive</strong> — SSR is the server delivering the first render <em>to</em> the SPA.</li>
<li>So Start is the only framework here with a fully documented, per-route, explicitly configurable client cache — because it has to be: the SPA never stops running.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="91" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="a-seventh-axis--dx-and-mental-models">A seventh axis — DX and mental models</h1>
<blockquote>
<p>All three frameworks require you to learn something new. The question is <strong>what kind of new.</strong></p>
</blockquote>
<ul>
<li><code>Astro</code> — keeps React completely separate from its own templating layer.</li>
<li><code>Next.js</code> — makes ordinary-looking React files behave differently based on invisible directives.</li>
<li><code>TanStack Start</code> — replaces invisible magic with real, callable JavaScript functions.</li>
</ul>
<blockquote>
<p><strong>The single best DX lens:</strong> is the framework's magic <strong>implicit</strong> (a convention you must memorize) or <strong>explicit</strong> (a function you can see, name, and trace)?</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="92" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="astro-dx--two-familiar-things-kept-separate">Astro DX — two familiar things, kept separate</h1>
<ul>
<li>The <code>.astro</code> component is closer to a classic template language (Handlebars, EJS, Pug) than to React.
<ul>
<li><code>---</code> fence = data fetching. Template below = HTML output. No hooks, no lifecycle.</li>
<li>Fits your intuition immediately because it <em>is</em> the old-school model.</li>
</ul>
</li>
<li>The React island is <strong>100% ordinary React</strong> — because it is a fully separate render tree with its own bundle.
<ul>
<li>No new React concepts. <code>useState</code>, <code>useEffect</code>, callbacks — all work as expected.</li>
</ul>
</li>
<li><strong>The trade-off:</strong> islands are separate trees. They don't share React state or context with the Astro shell or with each other.
<ul>
<li>Astro's answer: external stores (<code>nanostores</code>) rather than React-native state.</li>
<li>That <em>is</em> a new concept — but it is bolted onto an otherwise-familiar picture, not woven through everything.</li>
</ul>
</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="93" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="nextjs-dx--familiar-syntax-unfamiliar-rules">Next.js DX — familiar syntax, unfamiliar rules</h1>
<ul>
<li>You cannot <code>import</code> a Server Component inside a <code>'use client'</code> file.</li>
<li>The escape hatch is <strong>composition-by-children</strong> — not a higher-order component pattern:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-comment">// page.tsx (Server Component)</span>
&lt;<span class="hljs-title class_">ClientWrapper</span>&gt;
  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">ServerChild</span> /&gt;</span></span> {<span class="hljs-comment">/* rendered on server, passed as a resolved slot */</span>}
&lt;/<span class="hljs-title class_">ClientWrapper</span>&gt;
</code></pre>
<ul>
<li><code>ClientWrapper</code> never imports <code>ServerChild</code>; it just renders <code>{children}</code>.
<ul>
<li>The server resolved <code>ServerChild</code> before handing anything to the client tree.</li>
<li>Real pattern, but nothing in plain React trains you to think of <code>children</code> as a boundary-crossing mechanism.</li>
</ul>
</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="94" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="nextjs-dx--the-root-cause">Next.js DX — the root cause</h1>
<blockquote>
<p>Why do both &quot;<code>async</code> component / no hooks&quot; and &quot;can't import Server Component&quot; feel foreign at the same time?</p>
</blockquote>
<ul>
<li>Next repurposes <strong>ordinary-looking React syntax</strong> to mean something environment-dependent.</li>
<li>A string literal at the top of the file (<code>'use client'</code> / <code>'use server'</code>) is intercepted by the compiler and silently changes what the file is allowed to do and where it runs.</li>
<li>It looks identical to the React you know. It behaves differently.</li>
</ul>
<blockquote>
<p><strong>Astro's unfamiliarity</strong> is a new file type with new syntax → easy to see.<br />
<strong>Next's unfamiliarity</strong> is the same file type, same syntax, different semantics → harder to spot.</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="95" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="tanstack-start-dx--explicit-over-implicit">TanStack Start DX — explicit over implicit</h1>
<ul>
<li><code>createServerFn(...).handler(...)</code> is a <strong>real function</strong> you call, wrap, compose, and pass around.</li>
<li>No magic string. No compiler rewriting the meaning of a component file.</li>
<li>The server/client boundary is drawn by <strong>which function you're inside</strong>, not by a hidden annotation on the file.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> getGreeting = <span class="hljs-title function_">createServerFn</span>({ <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;GET&quot;</span> })
  .<span class="hljs-title function_">handler</span>(<span class="hljs-title function_">async</span> () =&gt; { ... });      <span class="hljs-comment">// server boundary is here, in the call chain</span>
</code></pre>
<ul>
<li>For someone from an SPA background: this is just &quot;a hook that calls an API, with the network boundary handled for you.&quot;</li>
<li>TanStack Router and Query are libraries SPA developers already have muscle memory for — Start reuses them rather than replacing them.</li>
</ul>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="96" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="implicit-vs-explicit-magic">Implicit vs. explicit magic</h1>
<table>
<thead>
<tr>
<th></th>
<th>What you must learn</th>
<th>Magic type</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Astro</strong></td>
<td><code>.astro</code> syntax, <code>client:*</code> directives, nanostores for cross-island state</td>
<td>Explicit — different file extension, tag-level directives you can see</td>
</tr>
<tr>
<td><strong>Next.js</strong></td>
<td>Server Component rules, <code>children</code> as boundary, <code>'use client'</code> / <code>'use server'</code> semantics</td>
<td>Implicit — same React syntax, compiler changes meaning invisibly</td>
</tr>
<tr>
<td><strong>TanStack Start</strong></td>
<td><code>createServerFn</code> builder chain, loader/staleTime model</td>
<td>Explicit — real function calls you can read, name, and trace</td>
</tr>
</tbody>
</table>
<blockquote>
<p>The throughline: Astro keeps React separate. Next changes React. Start just uses JavaScript.</p>
</blockquote>
<footer>261497: Fullstack Development</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="97" data-class="invert" data-paginate="true" data-footer="261497: Fullstack Development" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="97" style="--class:invert;--paginate:true;--footer:261497: Fullstack Development;--theme:default;" data-marpit-pagination-total="97">
<h1 id="which-one">Which one?</h1>
<table>
<thead>
<tr>
<th>Use case</th>
<th>Pick</th>
</tr>
</thead>
<tbody>
<tr>
<td>Content, docs, marketing, blogs</td>
<td><code>Astro</code></td>
</tr>
<tr>
<td>Mostly-static pages with a few interactive corners</td>
<td><code>Astro</code></td>
</tr>
<tr>
<td>Server-heavy app, big team, Vercel-shaped deploy</td>
<td><code>Next.js</code></td>
</tr>
<tr>
<td>Dashboards, editors, anything behind a login</td>
<td><code>TanStack Start</code></td>
</tr>
<tr>
<td>You already love TanStack Query/Router</td>
<td><code>TanStack Start</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>The Todo app is ~130 lines in <strong>all three</strong>. The difference is not the code — it's <strong>what ships</strong>.</p>
</blockquote>
